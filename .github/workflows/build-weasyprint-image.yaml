name: Build WeasyPrint image

# Publishes the PDF-rendering image (docker/weasyprint/Dockerfile) to the
# GitHub Container Registry (GHCR) so the deploy workflow can pull a prebuilt
# image instead of rebuilding it on every run — the GitHub-registry equivalent
# of the upstream "build a builder image once, pull it at deploy time" model.
on:
  push:
    branches:
      - master
    paths:
      - 'docker/weasyprint/**'
      - '.github/workflows/build-weasyprint-image.yaml'
  workflow_dispatch:  # allow a manual (re)publish from any branch

concurrency:
  group: build-weasyprint-image
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push the image to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # GHCR requires an all-lowercase image path; github.repository can carry
      # capitals (InnovateIt-ak/…), so lowercase it here.
      - name: Compute image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/weasyprint" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/weasyprint/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
