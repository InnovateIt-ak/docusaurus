name: PR preview

# Deploys a preview of each pull request to GitHub Pages, WITHOUT merging to
# master. The build is published to `pr-preview/pr-<N>/` on the gh-pages branch
# (alongside the main site at the root), the preview URL is posted as a comment
# on the PR, and the preview is removed when the PR is closed/merged.
#
# Requires GitHub Pages to be served from the gh-pages branch
# (Settings → Pages → Deploy from a branch → gh-pages / root).
#
# Note: previews only run for pull requests from branches in this repository.
# Fork PRs get a read-only GITHUB_TOKEN and cannot publish a preview.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# Supersede an in-flight preview build when the PR gets a new push.
concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

env:
  G_PROJECT_NAME: docusaurus
  G_ORGANIZATION_NAME: InnovateIt-ak
  G_HOST_URL: https://innovateit-ak.github.io
  # Assets must resolve under the preview sub-path.
  G_BASE_URL: /docusaurus/pr-preview/pr-${{ github.event.number }}/

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the preview to the gh-pages branch
      pull-requests: write # comment the preview URL on the PR

    # PlantUML server so the remark plugin can render diagrams at build time.
    services:
      plantuml:
        image: plantuml/plantuml-server:jetty
        ports:
          - 8080:8080
    env:
      PLANTUML_BUILD_URL: http://localhost:8080

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Build only when deploying (opened / reopened / synchronize). On a closed
      # PR we skip straight to removing the preview.
      - name: Setup Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm install --no-audit --no-fund

      - name: Provide Chromium for Mermaid
        if: github.event.action != 'closed'
        run: |
          npm install --no-save puppeteer@24.10.0
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$CHROME" ]; then
            sudo apt-get update && sudo apt-get install -y chromium-browser
            CHROME="$(command -v chromium-browser || command -v chromium)"
          fi
          echo "Using Chromium at: $CHROME"
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"

      - name: Disable LikeC4 page (upstream default)
        if: github.event.action != 'closed'
        run: rm -f src/pages/likec4.tsx

      - name: Wait for PlantUML server
        if: github.event.action != 'closed'
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ >/dev/null && { echo "PlantUML is up"; exit 0; }
            sleep 2
          done
          echo "::warning::PlantUML server did not become ready; diagrams may render as placeholders"

      - name: Build Docusaurus (preview base URL)
        if: github.event.action != 'closed'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Disable Jekyll
        if: github.event.action != 'closed'
        run: touch build/.nojekyll

      # Deploys the build to pr-preview/pr-<N>/ on gh-pages, comments the URL,
      # and (on a closed PR) removes the preview. The action picks the right
      # behaviour from the pull_request event action.
      - name: Deploy / update / remove preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./build
          umbrella-dir: pr-preview
