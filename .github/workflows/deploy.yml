name: Build and Deploy Docusaurus

on:
  push:
    branches:
      - '**'  # publie GitHub Pages depuis n'importe quelle branche
  pull_request:
  workflow_dispatch:  # permet un déploiement manuel depuis n'importe quelle branche

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Un seul déploiement Pages à la fois (évite que push master et PR se télescopent).
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy-github-pages:
    runs-on: [ubuntu-latest]
    # Publie sur GitHub Pages sur push (quelle que soit la branche) ou sur
    # déclenchement manuel. Sur `pull_request`, on ne déploie QUE pour les PR
    # venant d'un fork : une PR de branche interne est déjà déployée par son
    # événement `push`, et déclencher les deux produit DEUX déploiements Pages
    # concurrents pour le même commit — le second échoue (collision push/PR).
    if: >-
      github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name != github.repository)
    permissions:
      contents: read
      pages: write
      id-token: write
      packages: read  # pull the prebuilt WeasyPrint image from GHCR

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # PlantUML server so the remark plugin can render diagrams at build time.
    services:
      plantuml:
        image: plantuml/plantuml-server:jetty
        ports:
          - 8080:8080
    env:
      PLANTUML_BUILD_URL: http://localhost:8080

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Mermaid diagrams are pre-rendered to SVG at build time by a headless
      # Chromium driven by Puppeteer (see src/remark/mermaid-renderer.mjs).
      # `npm ci` already downloads the browser as a Puppeteer dependency; this
      # makes it explicit so a diagram never silently degrades to a placeholder.
      - name: Install Chromium for Mermaid (Puppeteer)
        run: npx puppeteer browsers install chrome-headless-shell

      - name: Wait for PlantUML server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ >/dev/null && { echo "PlantUML is up"; exit 0; }
            sleep 2
          done
          echo "::warning::PlantUML server did not become ready; diagrams may render as placeholders"

      - name: Build Docusaurus
        # GITHUB_TOKEN lets the changelog plugin read the repo's Releases via the
        # GitHub API without hitting the low unauthenticated rate limit.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: BASE_URL="/docusaurus" npm run build

      # Auto-discover doc content and generate, after the build:
      #   * one build/docs/.../<page>.pdf per page (mirrors the page route so a
      #     page at /docs/a/b is downloadable at /docs/a/b.pdf — see the footer
      #     link in src/theme/DocItem/Footer),
      #   * one build/<section>.pdf per top-level docs/ section, and
      #   * a global build/documentation.pdf (all docs).
      - name: Log in to GitHub Container Registry
        # Lets the next step pull the prebuilt WeasyPrint image from GHCR.
        # Non-fatal: a fork PR without package access simply falls back to a
        # local build in the step below.
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate PDFs with WeasyPrint
        env:
          BASE_URL: /docusaurus
        run: |
          # Use the prebuilt WeasyPrint image from the GitHub Container
          # Registry (published by build-weasyprint-image.yaml). Fall back to a
          # local build on the first run, on a PR that changed the Dockerfile
          # before the image is (re)published, or when GHCR isn't reachable
          # (e.g. a fork PR without package access).
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/weasyprint:latest"
          if docker pull "$IMAGE" 2>/dev/null; then
            echo "Using $IMAGE from GHCR"
          else
            echo "::notice::$IMAGE unavailable — building the image locally"
            IMAGE=docusaurus-weasyprint
            docker build -f docker/weasyprint/Dockerfile -t "$IMAGE" .
          fi

          # weasy <output-path-under-build-root> <title> [extra generator args…]
          weasy() {
            out="$1"; title="$2"; shift 2
            mkdir -p "$(dirname "$out")"
            docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/data" \
              "$IMAGE" \
              --build-dir=/data/build --output="/data/$out" \
              --base-url="$BASE_URL" --title="My Site — $title" \
              --eyebrow="Documentation" --toc-title="Table of Contents" "$@" \
              || echo "::warning::skipped $out (no eligible content)"
          }
          titlecase() { echo "$1" | sed -E 's/[-_]+/ /g; s/\b(.)/\U\1/g'; }

          # One PDF per page: mirror the page route as <route>.pdf next to it.
          # Skip generated-index category pages (/docs/category/*), which are not
          # real doc pages and carry no footer download link.
          while IFS= read -r index; do
            dir=$(dirname "$index"); rel=${dir#build}
            case "$rel" in */category/*) continue ;; esac
            # Skip generated-index / section landing pages: they carry no real
            # markdown article (no .theme-doc-markdown), just a grid of cards, so
            # they must never be rendered to PDF. Robust for any URL, not just
            # /docs/category/*.
            grep -q 'theme-doc-markdown' "$index" || continue
            weasy "build${rel}.pdf" "$(titlecase "$(basename "$dir")")" \
              --include-exact="${rel}/"
          done < <(find build/docs -name index.html)

          # One PDF per top-level section (skip _* partials that produced no route).
          # Strip a Docusaurus number prefix from the folder name to get the built
          # route/slug: docs/06-standards/ → build/docs/standards → /standards.pdf.
          for d in docs/*/; do
            s=$(basename "$d")
            case "$s" in _*) continue ;; esac
            slug=$(printf '%s' "$s" | sed -E 's/^[0-9]+[[:space:]]*[-_.][[:space:]]*//; t; s/^[0-9]+[[:space:]]+//')
            [ -d "build/docs/$slug" ] || continue
            weasy "build/$slug.pdf" "$(titlecase "$slug")" --include="/docs/$slug/"
          done

          # Global: everything.
          weasy "build/documentation.pdf" "Full documentation" --include="/docs/"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Generate the PDF on every push and pull request and expose it as an
  # artifact (useful for review before anything is deployed).
  build-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read  # pull the prebuilt WeasyPrint image from GHCR

    # PlantUML server so the remark plugin can render diagrams at build time.
    services:
      plantuml:
        image: plantuml/plantuml-server:jetty
        ports:
          - 8080:8080
    env:
      PLANTUML_BUILD_URL: http://localhost:8080

    steps:
