            sleep 2
          done
          echo "::warning::PlantUML server did not become ready; diagrams may render as placeholders"

      - name: Build Docusaurus
        # GITHUB_TOKEN lets the changelog plugin read the repo's Releases via the
        # GitHub API without hitting the low unauthenticated rate limit.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: BASE_URL="/" npm run build

      # Auto-discover doc content and generate, after the build:
      #   * one build/docs/.../<page>.pdf per page (mirrors the page route),
      #   * one build/<section>.pdf per top-level docs/ section, and
      #   * a global build/documentation.pdf (all docs).
