      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation-pdfs
          # Section/global PDFs at the build root plus one PDF per page nested
          # under build/docs/**.
          path: |
            build/*.pdf
            build/docs/**/*.pdf