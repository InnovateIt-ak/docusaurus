services:
  plantuml:
    image: artifactory.eeas.europa.eu/docker.io-docker-remote/plantuml/plantuml-server:jetty
    ports:
      - "8080:8080"
    environment:
      PLANTUML_LIMIT_SIZE: "16384"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5